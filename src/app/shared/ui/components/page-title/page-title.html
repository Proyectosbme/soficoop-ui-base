<section class="page-title">
  <div class="hero-content">
    <div class="hero-icon" *ngIf="icon">
      <i [class]="icon"></i>
    </div>
    <div>
      <div class="page-heading">{{ title }}</div>
      <div class="page-subtitle" *ngIf="subtitle">{{ subtitle }}</div>
    </div>
  </div>
</section>
