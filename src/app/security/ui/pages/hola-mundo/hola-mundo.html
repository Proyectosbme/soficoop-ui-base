<app-dynamic-tabs
  [tabs]="tabs"
  [activeValue]="activeTab"
  [templates]="tabTemplates"
  (tabChange)="onTabChange($event)"
>
</app-dynamic-tabs>

<!-- 🔽 Templates de los tabs -->

<ng-template #tabUnoTpl>
  <div class="card">
    <h3>Hola 👋</h3>
    <p>Este es el contenido del primer tab.</p>
  </div>
</ng-template>

<ng-template #tabDosTpl>
  <div class="card">
    <h3>Segundo Tab</h3>
    <p>Aquí puedes poner cualquier componente.</p>
  </div>
</ng-template>
